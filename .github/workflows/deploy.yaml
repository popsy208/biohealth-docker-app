name: BioHealthBuzz CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/biohealthbuzz:latest6 .

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/biohealthbuzz:latest6

    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.HOST }}
        username: hybeeuser
        key: ${{ secrets.SSH_KEY }}
        script: |
          docker stop biohealthbuzz || true
          docker rm biohealthbuzz || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/biohealthbuzz:latest6
          docker run -d -p 80:80 --name biohealthbuzz ${{ secrets.DOCKER_USERNAME }}/biohealthbuzz:latest6